[package]
name = "tiktok-live-tts"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jesteban19/tiktok-live-tts-macos"
[lib]
name = "tiktok_live_tts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = "0.1"
[dev-dependencies]
tempfile = "3"
